server:
  port: 9084

spring:
  application:
    name: agent-platform-llm
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/rk_agent_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: yangming
    password: xiaozei0207

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.rk.agent.llm.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  packages-to-scan: com.rk.agent.llm.controller

agent:
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:REPLACE_ME}
      base-url: https://api.openai.com/v1
      default-model: gpt-4o
      timeout-seconds: 120
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:REPLACE_ME}
      base-url: https://api.anthropic.com
      default-model: claude-3-5-sonnet-20241022
      timeout-seconds: 120
    qwen:
      api-key: ${QWEN_API_KEY:REPLACE_ME}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      default-model: qwen-plus
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:REPLACE_ME}
      base-url: https://api.deepseek.com/v1
      default-model: deepseek-chat
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:REPLACE_ME}
      base-url: https://api.siliconflow.cn/v1
      default-model: deepseek-ai/DeepSeek-V4-Pro

logging:
  level:
    com.rk.agent: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
